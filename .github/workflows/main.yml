name: Flutter Build APK

on:
  push:
    branches:
      - main # أو اسم الفرع الخاص بك مثل master أو ريسي

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. جلب الكود الخاص بالمشروع من المستودع
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. إعداد بيئة جافا (مهمة جداً لبناء أندرويد)
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. إعداد بيئة فلاتر وتحديد الإصدار
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 4. جلب المكتبات والاعتمادات الخاصة بمشروعك
      - name: Install dependencies
        run: flutter pub get

      # 5. أمر بناء ملف الـ APK بصيغة الـ Release
      - name: Build APK
        run: flutter build apk --release

      # 6. رفع ملف الـ APK الناتج لكي تتمكن من تحميله
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
