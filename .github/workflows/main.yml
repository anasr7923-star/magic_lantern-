name: Flutter Build APK
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # السطر ده هو الحل الجذري اللي هيجبر الأداة تدخل جوة مجلد مشروعك فوراً وتلغي خطأ الـ root
          project-src: 'magic_lantern'
          
      - run: flutter pub get
        working-directory: magic_lantern
        
      - run: flutter build apk --release
        working-directory: magic_lantern
        
      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: magic_lantern/build/app/outputs/flutter-apk/app-release.apk
          
