name: Flutter Build APK

on:
  push:
    branches:
      - main # تأكد أن هذا هو اسم الفرع الافتراضي لديك (main أو master)

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. جلب الكود من المستودع
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. إعداد بيئة جافا لبناء الأندرويد
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. إعداد بيئة فلاتر
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 4. الانتقال المباشر للمجلد الصحيح وتشغيل الأوامر
      - name: Install dependencies & Build APK
        run: |
          # الانتقال إلى مجلد magic_lantern بغض النظر عن اسم المجلد الأب الخارجي
          cd **/magic_lantern
          
          echo "المسار الحالي للبناء هو:"
          pwd
          
          # التأكد من وجود ملف main.dart قبل البدء
          if [ ! -f "lib/main.dart" ]; then
            echo "خطأ خطير: لم يتم العثور على lib/main.dart في هذا المجلد!"
            ls -R lib/
            exit 1
          fi
          
          # تشغيل أوامر فلاتر
          flutter pub get
          flutter build apk --release
          
          # تجميع ملف الـ APK ونقله للخارج لرفعه
          mkdir -p $GITHUB_WORKSPACE/output
          cp build/app/outputs/flutter-apk/app-release.apk $GITHUB_WORKSPACE/output/

      # 5. رفع ملف الـ APK النهائي للتحميل
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: output/app-release.apk
