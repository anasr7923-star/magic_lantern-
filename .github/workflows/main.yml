name: Flutter Build APK
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      # الدخول للمسار الثلاثي الصحيح والمطابق لمستودعك حياً لتنزيل الحزم
      - run: flutter pub get
        working-directory: magic_lantern-/magic_lantern
        
      # بناء ملف الـ APK النهائي المكتمل بـ 0 أخطاء من داخل المجلد الفعلي
      - run: flutter build apk --release -t lib/main.dart
        working-directory: magic_lantern-/magic_lantern
        
      # رفع واستخراج ملف الـ APK النهائي للتحميل المباشر من المتصفح
      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: magic_lantern-/magic_lantern/build/app/outputs/flutter-apk/app-release.apk
          
