name: Flutter Build APK

on:
  push:
    branches:
      - main # أو رئيسي حسب اسم الفرع لديك

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. جلب الكود الخاص بالمشروع
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. إعداد بيئة جافا لبناء الأندرويد
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. إعداد بيئة فلاتر
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 4. جلب المكتبات والبناء التلقائي من داخل مجلد فلاتر أينما كان موقعه
      - name: Install dependencies & Build APK
        run: |
          # البحث التلقائي عن المجلد الذي يحتوي على ملف مشروع فلاتر والدخول إليه
          cd $(dirname $(find . -name "pubspec.yaml" -not -path "*/.*" | head -n 1))
          
          echo "تم العثور على مشروع فلاتر في المسار التالي:"
          pwd
          
          # تشغيل أوامر فلاتر بالترتيب داخل المجلد الصحيح
          flutter pub get
          flutter build apk --release
          
          # نقل ملف الـ APK الناتج إلى المجلد الرئيسي الخارجي لسهولة رفعه
          mkdir -p $GITHUB_WORKSPACE/output
          cp build/app/outputs/flutter-apk/app-release.apk $GITHUB_WORKSPACE/output/

      # 5. رفع ملف الـ APK النهائي للتحميل
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: output/app-release.apk
          
