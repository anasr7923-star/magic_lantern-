name: magic_lantern
description: "برنامج النقل الذكي والمحافظ الموحدة الفاخر لعام 2026"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^8.2.1
  http: ^1.2.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  geolocator: ^11.0.0
  google_maps_flutter: ^2.5.3
  google_maps_flutter_web: ^0.5.4+2
  in_app_update: ^5.0.0
  image_picker: ^1.2.4
  permission_handler: ^11.4.0
  sqflite: ^2.4.4+2
  path: ^1.9.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

# إعدادات توليد أيقونة تطبيق الفانوس السحري أوتوماتيكياً لجميع الهواتف (تراكمي مدمج)
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - images/


